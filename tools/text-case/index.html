<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free text case converter tool. Convert text to uppercase, lowercase, camelCase, snake_case, PascalCase, kebab-case, and more.">
    <meta name="keywords" content="text case converter, uppercase converter, lowercase converter, camelCase, snake_case, PascalCase, text formatter">
    <meta name="author" content="Your Companion">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Text Case Converter - Free Online Text Formatter">
    <meta property="og:description" content="Convert text between 10 different case types instantly.">
    <meta property="og:url" content="https://yashwantbuilds.github.io/your-companion/tools/text-case/">
    <canonical href="https://yashwantbuilds.github.io/your-companion/tools/text-case/">
    
    <title>Text Case Converter - Free Online Text Case Converter Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .breadcrumb {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .breadcrumb a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: 600;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .main-content {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: monospace;
            resize: vertical;
            min-height: 250px;
            font-size: 0.9em;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .case-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .case-btn {
            padding: 10px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        .case-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .outputs {
            margin-top: 20px;
        }

        .output-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 2px solid #e0e0e0;
            font-size: 0.9em;
        }

        .output-label {
            color: #667eea;
            font-weight: 600;
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .output-text {
            font-family: monospace;
            color: #333;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .case-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breadcrumb">
            <a href="../../">Your Companion</a> / Tools / Text Case Converter
        </div>
        
        <a href="../../" class="back-link">← Back to Home</a>

        <header>
            <h1>🔤 Text Case Converter</h1>
            <p>Convert text to different cases and formats instantly</p>
        </header>

        <div class="main-content">
            <div class="controls">
                <button class="btn-secondary" onclick="pasteText()">📋 Paste</button>
                <button class="btn-secondary" onclick="downloadResults()">⬇️ Download</button>
                <button class="btn-secondary" onclick="clearAll()">🗑️ Clear</button>
            </div>

            <div class="grid-2">
                <div class="section">
                    <h3>✍️ Input Text</h3>
                    <textarea id="inputText" placeholder="Enter or paste your text here..." oninput="convertAllCases()"></textarea>
                </div>

                <div class="section">
                    <h3>🎨 Convert Options</h3>
                    <div class="case-buttons">
                        <button class="case-btn" onclick="selectCase('upper')">UPPERCASE</button>
                        <button class="case-btn" onclick="selectCase('lower')">lowercase</button>
                        <button class="case-btn" onclick="selectCase('title')">Title Case</button>
                        <button class="case-btn" onclick="selectCase('camel')">camelCase</button>
                        <button class="case-btn" onclick="selectCase('pascal')">PascalCase</button>
                        <button class="case-btn" onclick="selectCase('snake')">snake_case</button>
                        <button class="case-btn" onclick="selectCase('kebab')">kebab-case</button>
                        <button class="case-btn" onclick="selectCase('constant')">CONSTANT_CASE</button>
                        <button class="case-btn" onclick="selectCase('toggle')">tOGGLE cASE</button>
                        <button class="case-btn" onclick="selectCase('sentence')">Sentence case</button>
                    </div>
                </div>
            </div>

            <div class="outputs">
                <h3 style="color: #333; margin-bottom: 15px;">📤 Conversions</h3>
                <div id="outputContainer"></div>
            </div>
        </div>
    </div>

    <script>
        function convertAllCases() {
            const text = document.getElementById('inputText').value;
            if (!text) {
                document.getElementById('outputContainer').innerHTML = '';
                return;
            }

            const conversions = {
                'UPPERCASE': text.toUpperCase(),
                'lowercase': text.toLowerCase(),
                'Title Case': toTitleCase(text),
                'camelCase': toCamelCase(text),
                'PascalCase': toPascalCase(text),
                'snake_case': toSnakeCase(text),
                'kebab-case': toKebabCase(text),
                'CONSTANT_CASE': toConstantCase(text),
                'tOGGLE cASE': toggleCase(text),
                'Sentence case': toSentenceCase(text)
            };

            let html = '';
            for (const [label, result] of Object.entries(conversions)) {
                html += `
                    <div class="output-item">
                        <div class="output-label">${label}</div>
                        <div class="output-text">${escapeHtml(result)}</div>
                    </div>
                `;
            }

            document.getElementById('outputContainer').innerHTML = html;
        }

        function toTitleCase(str) {
            return str.replace(/\b\w+/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
        }

        function toSentenceCase(str) {
            return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
        }

        function toggleCase(str) {
            return str.split('').map(char => 
                char === char.toUpperCase() ? char.toLowerCase() : char.toUpperCase()
            ).join('');
        }

        function toCamelCase(str) {
            return str.trim().split(/[\s_-]+/).map((word, i) => {
                const lower = word.toLowerCase();
                return i === 0 ? lower : lower.charAt(0).toUpperCase() + lower.slice(1);
            }).join('');
        }

        function toPascalCase(str) {
            return str.trim().split(/[\s_-]+/).map(word => {
                const lower = word.toLowerCase();
                return lower.charAt(0).toUpperCase() + lower.slice(1);
            }).join('');
        }

        function toSnakeCase(str) {
            return str.trim().replace(/([a-z])([A-Z])/g, '$1_$2').replace(/[\s-]+/g, '_').toLowerCase();
        }

        function toKebabCase(str) {
            return str.trim().replace(/([a-z])([A-Z])/g, '$1-$2').replace(/[\s_]+/g, '-').toLowerCase();
        }

        function toConstantCase(str) {
            return str.trim().replace(/([a-z])([A-Z])/g, '$1_$2').replace(/[\s-]+/g, '_').toUpperCase();
        }

        function selectCase(caseType) {
            const text = document.getElementById('inputText').value;
            if (!text) return;

            const conversions = {
                'upper': text.toUpperCase(),
                'lower': text.toLowerCase(),
                'title': toTitleCase(text),
                'camel': toCamelCase(text),
                'pascal': toPascalCase(text),
                'snake': toSnakeCase(text),
                'kebab': toKebabCase(text),
                'constant': toConstantCase(text),
                'toggle': toggleCase(text),
                'sentence': toSentenceCase(text)
            };

            if (conversions[caseType]) {
                document.getElementById('inputText').value = conversions[caseType];
                convertAllCases();
            }
        }

        function pasteText() {
            navigator.clipboard.readText().then(text => {
                document.getElementById('inputText').value = text;
                convertAllCases();
            }).catch(() => alert('Error reading clipboard'));
        }

        function downloadResults() {
            const text = document.getElementById('inputText').value;
            if (!text) {
                alert('Please enter text first');
                return;
            }

            const conversions = {
                'UPPERCASE': text.toUpperCase(),
                'lowercase': text.toLowerCase(),
                'Title Case': toTitleCase(text),
                'camelCase': toCamelCase(text),
                'PascalCase': toPascalCase(text),
                'snake_case': toSnakeCase(text),
                'kebab-case': toKebabCase(text),
                'CONSTANT_CASE': toConstantCase(text)
            };

            let content = 'TEXT CASE CONVERSIONS\n' + '='.repeat(40) + '\n\n';
            for (const [label, result] of Object.entries(conversions)) {
                content += `${label}:\n${result}\n\n`;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'text-conversions.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputContainer').innerHTML = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
